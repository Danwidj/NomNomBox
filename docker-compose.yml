version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      LISTENERS: INTERNAL://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      command: >
        sh -c "sleep 5 &&
        kafka-topics --bootstrap-server kafka:9092 --create --topic driver-schedule-updates --replication-factor 1 --partitions 1"
    volumes:
      - kafka_data:/var/lib/kafka/data

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ####################################
  # RabbitMQ: The messaging broker
  ####################################
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  rabbitmq_setup:
    image: NomNomBox/rabbitmq-setup:latest
    build:
      context: ./RabbitMQ
      dockerfile: dockerfile
    depends_on:
      - rabbitmq

  manage_deliveries:
    image: NomNomBox/manage_deliveries:latest
    build:
      context: ./manage_deliveries
      dockerfile: dockerfile
    ports:
      - "5000:5000"

  # driver_frontend:
  #   image: NomNomBox/driver_frontend:latest
  #   build:
  #     context: ./UI_Delivery
  #     dockerfile: dockerfile
  #   ports:
  #     - "3000:3000"

  order:
    image: NomNomBox/order:latest
    build:
      context: ./order
      dockerfile: Dockerfile
    ports:
      - "5001:5003"

  delivery:
    image: NomNomBox/delivery:latest
    build:
      context: ./delivery
      dockerfile: Dockerfile
    ports:
      - "5002:5000"

  # Add the UI_customer service
  customer_frontend:
    image: NomNomBox/customer_frontend:latest
    build:
      context: ./UI_customer
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_CUSTOMER_API_URL=http://customer:5002
      - VITE_ORDER_API_URL=http://order:5001
      - VITE_MANAGE_DELIVERIES_URL=http://manage_deliveries:5000
    depends_on:
      - order
      - customer

  # Add the customer service
  customer:
    image: NomNomBox/customer:latest
    build:
      context: ./customer
      dockerfile: Dockerfile
    ports:
      - "5003:5002"

  payment:
    image: NomNomBox/payment:latest
    build:
      context: ./payment
      dockerfile: Dockerfile
    ports:
      - "5004:5004"

  inventory:
    image: NomNomBox/inventory:latest
    build:
      context: ./inventory
      dockerfile: Dockerfile
    ports:
      - "5006:5006"

  order_composite:
    image: NomNomBox/order_composite:latest
    build:
      context: ./order_composite
      dockerfile: Dockerfile
    ports:
      - "5005:5005"

  schedule:
    image: NomNomBox/schedule:latest
    build:
      context: ./schedule
      dockerfile: dockerfile
    ports:
      - "5007:5001"
    depends_on:
      - kafka

  notifications:
    image: NomNomBox/notifications:latest
    build:
      context: ./notifications
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
    - RABBITMQ_HOST=rabbitmq
    - RABBITMQ_PORT=5672
    depends_on:
      - rabbitmq

networks:
  default:
    driver: bridge
    name: nomnombox-net

volumes:
  rabbitmq_data:
    name: rabbitmq_data
  kafka_data:
    name: kafka_data
  redis_data:
    name: redis_data
